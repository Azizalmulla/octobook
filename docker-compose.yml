services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octokiss
      POSTGRES_PASSWORD: octokiss
      POSTGRES_DB: octokiss
    ports:
      - "5432:5432"
    volumes:
      - octokiss_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octokiss -d octokiss"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  octokiss_pg:
